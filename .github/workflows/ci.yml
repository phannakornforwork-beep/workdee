# ตรวจทุกครั้งที่ push: ฐานข้อมูล + API, ตรวจ type, build และเปิดหน้าเว็บจริงทุกหน้า
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  api:
    name: Database and API tests
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
        ports: ['54322:5432']
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s --health-timeout 5s --health-retries 20
    env:
      DB_URL: postgres://postgres:postgres@127.0.0.1:54322/postgres
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install psql
        run: sudo apt-get update -qq && sudo apt-get install -y -qq postgresql-client
      - name: Start Supabase-compatible stack (Auth + REST + Storage stub)
        run: bash tests/stack/start.sh
      - name: API tests
        run: npm run test:api
      - name: Stack logs
        if: failure()
        run: tail -n 120 .stack/logs/*.log

  types:
    name: Typecheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Typecheck
        run: npm run typecheck

  web:
    name: Build and page smoke test
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
        ports: ['54322:5432']
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s --health-timeout 5s --health-retries 20
    env:
      DB_URL: postgres://postgres:postgres@127.0.0.1:54322/postgres
      NEXT_TELEMETRY_DISABLED: '1'
      CRON_SECRET: ci-cron-secret
      NEXT_PUBLIC_SITE_URL: http://127.0.0.1:3000
      NEXT_PUBLIC_SUPABASE_URL: http://127.0.0.1:54321
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Install psql
        run: sudo apt-get update -qq && sudo apt-get install -y -qq postgresql-client
      - name: Start Supabase-compatible stack
        run: |
          bash tests/stack/start.sh
          . .stack/keys.env
          echo "NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY=$SUPABASE_ANON_KEY" >> "$GITHUB_ENV"
          echo "SUPABASE_SECRET_KEY=$SUPABASE_SERVICE_ROLE_KEY" >> "$GITHUB_ENV"
      - name: Build
        run: npm run build
      - name: Start the site
        run: |
          nohup npx next start -p 3000 > next.log 2>&1 &
          node tests/stack/wait-for.mjs http://127.0.0.1:3000/login 90
      - name: Smoke test every main page
        run: npm run test:smoke
        env:
          WEB_URL: http://127.0.0.1:3000
      - name: Logs
        if: failure()
        run: |
          tail -n 200 next.log || true
          tail -n 80 .stack/logs/*.log || true
